backend:
  name: git-gateway
  branch: main
media_folder: public/images
public_folder: /images
locale: fr
collections:
  - name: stories
    label: Récits et contenu
    folder: src/content
    create: true
    slug: "{{slug}}"
    format: frontmatter
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Corps du contenu
        name: body
        widget: markdown